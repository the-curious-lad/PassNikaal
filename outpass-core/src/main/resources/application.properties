# =============================================================================
# PassNikaal - Outpass Core
# Base application configuration
#
# HOW PROFILES WORK:
#   Spring Boot loads this file first, then overlays the active profile file.
#   - Local dev:   set SPRING_PROFILES_ACTIVE=dev  (uses application-dev.properties)
#   - Production:  do not set a profile. All secrets must come from env vars.
#
# ENV VAR SYNTAX: ${VAR_NAME} fails fast if the variable is not set.
#                 ${VAR_NAME:default} uses the default value if not set.
# =============================================================================

spring.application.name=passnikaal-outpass-core

# ─────────────────────────────────────────────────────────────────────────────
# SERVER
# ─────────────────────────────────────────────────────────────────────────────

# The HTTP port this service listens on.
# Default 8080. Override with SERVER_PORT env var if needed.
server.port=${SERVER_PORT:8080}

# ─────────────────────────────────────────────────────────────────────────────
# DATABASE
# DATABASE_URL format: jdbc:postgresql://<host>:<port>/<dbname>
# Example:             jdbc:postgresql://localhost:5432/passnikaal
# ─────────────────────────────────────────────────────────────────────────────

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings.
# maximum-pool-size: max DB connections this service can hold open.
# minimum-idle: connections kept alive even when there's no load.
# connection-timeout: max ms to wait for a connection from the pool.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.pool-name=OutpassCoreHikariPool

# ─────────────────────────────────────────────────────────────────────────────
# JPA / HIBERNATE
# ─────────────────────────────────────────────────────────────────────────────

# update: Hibernate adds missing columns/tables but never deletes anything.
# In production, use Flyway or Liquibase for schema migrations instead.
# For this MVP, 'update' is acceptable since we own the database.
spring.jpa.hibernate.ddl-auto=update

# Do not print SQL in production logs. Enable in application-dev.properties.
spring.jpa.show-sql=false

# Tell Hibernate we are using PostgreSQL dialect for proper SQL generation.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pretty-print SQL in logs (only useful when show-sql=true).
spring.jpa.properties.hibernate.format_sql=false

# ─────────────────────────────────────────────────────────────────────────────
# JWT
# jwt.secret must be at least 256 bits (32 chars) for HMAC-SHA256.
# Never hardcode this. Always use an environment variable.
# ─────────────────────────────────────────────────────────────────────────────

jwt.secret=${JWT_SECRET}
# Access token expiry in minutes. Decision D-02: 15-30 minutes.
jwt.access-token-expiry-minutes=${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:15}
# Refresh token expiry in days. Decision D-02: 7 days.
jwt.refresh-token-expiry-days=${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}

# ─────────────────────────────────────────────────────────────────────────────
# MAIL
# Used to send email verification links and outpass notification emails.
# For production: use a proper SMTP service (SendGrid, SES, Mailgun).
# ─────────────────────────────────────────────────────────────────────────────

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
# STARTTLS: required by most SMTP providers (e.g. Gmail, SendGrid).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ─────────────────────────────────────────────────────────────────────────────
# AWS S3
# Used for storing and serving QR code images.
# In production, use an IAM role on EC2 instead of access keys.
# ─────────────────────────────────────────────────────────────────────────────

aws.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# ─────────────────────────────────────────────────────────────────────────────
# APPLICATION BUSINESS RULES
# These are configurable without code changes.
# ─────────────────────────────────────────────────────────────────────────────

# Email verification token validity. Decision D-01: 24 hours.
app.email-verification.token-expiry-hours=${EMAIL_VERIFICATION_EXPIRY_HOURS:24}

# Market outpass creation cutoff time. Decision D-03: 7:00 PM.
# Format: HH:mm (24-hour). Students cannot create a MARKET outpass after this time.
outpass.market.creation-cutoff-time=${MARKET_CREATION_CUTOFF_TIME:19:00}

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING
# In production, use INFO. DEBUG produces very verbose output.
# ─────────────────────────────────────────────────────────────────────────────

logging.level.com.passnikaal=INFO
logging.level.org.springframework.security=WARN
logging.level.root=WARN
