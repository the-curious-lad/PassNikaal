# =============================================================================
# PassNikaal - Cutoff Service
# Base application configuration
#
# This service is a headless scheduled-job runner with NO web server.
# spring.main.web-application-type=none prevents Tomcat from starting.
# =============================================================================

spring.application.name=passnikaal-cutoff-service

# ─────────────────────────────────────────────────────────────────────────────
# NO WEB SERVER
# This service runs only scheduled jobs - no HTTP listener is needed.
# ─────────────────────────────────────────────────────────────────────────────

spring.main.web-application-type=none

# ─────────────────────────────────────────────────────────────────────────────
# DATABASE
# Same database as outpass-core. Different HikariCP pool (separate JVM process).
# Smaller pool because this service does batch processing, not high-concurrency reads.
# ─────────────────────────────────────────────────────────────────────────────

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=CutoffServiceHikariPool

# ─────────────────────────────────────────────────────────────────────────────
# JPA / HIBERNATE
#
# CRITICAL: ddl-auto=none. The cutoff-service must NEVER create or modify tables.
# Schema ownership belongs to outpass-core. If this service accidentally drops
# or alters a table, data can be corrupted or lost.
# ─────────────────────────────────────────────────────────────────────────────

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─────────────────────────────────────────────────────────────────────────────
# MAIL
# Same SMTP config as outpass-core. Sends hostel confirmation emails.
# ─────────────────────────────────────────────────────────────────────────────

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ─────────────────────────────────────────────────────────────────────────────
# AWS S3
# Used to batch-delete obsolete QR images during the 9 PM job.
# ─────────────────────────────────────────────────────────────────────────────

aws.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# ─────────────────────────────────────────────────────────────────────────────
# CUTOFF JOB CONFIGURATION
# cron: Quartz-style 6-field cron. "0 0 21 * * *" = every day at 9:00:00 PM.
# batch-size: How many outpasses to process per database fetch in each loop.
# ─────────────────────────────────────────────────────────────────────────────

cutoff.cron=${CUTOFF_CRON:0 0 21 * * *}
cutoff.batch-size=${CUTOFF_BATCH_SIZE:100}

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────────────────────────────────────────

logging.level.com.passnikaal=INFO
logging.level.root=WARN
