# =============================================================================
# PassNikaal - Outpass Core
# DEV profile overrides (application-dev.properties)
#
# Activated by: SPRING_PROFILES_ACTIVE=dev  (or -Dspring.profiles.active=dev)
#
# This file provides safe local defaults so developers can run the application
# without setting any environment variables.
#
# NEVER commit real secrets to this file. These are local-only defaults.
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# DATABASE - local PostgreSQL instance
# Run locally: docker run -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=passnikaal -p 5432:5432 postgres:16
# ─────────────────────────────────────────────────────────────────────────────

spring.datasource.url=jdbc:postgresql://localhost:5432/passnikaal
spring.datasource.username=postgres
spring.datasource.password=aditi20052003

# ─────────────────────────────────────────────────────────────────────────────
# JPA - show SQL in dev for easier debugging
# ─────────────────────────────────────────────────────────────────────────────

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────────────────────────────────────
# JWT - dev secret (NOT for production)
# Must be at least 32 characters for HMAC-SHA256.
# Change access token expiry to something longer so you don't have to
# keep refreshing during manual testing.
# ─────────────────────────────────────────────────────────────────────────────

jwt.secret=dev-only-secret-key-minimum-256-bits-long-never-use-in-prod
jwt.access-token-expiry-minutes=60
jwt.refresh-token-expiry-days=7

# ─────────────────────────────────────────────────────────────────────────────
# MAIL - use MailHog for local email testing
# Run MailHog: docker run -p 1025:1025 -p 8025:8025 mailhog/mailhog
# MailHog web UI: http://localhost:8025
# ─────────────────────────────────────────────────────────────────────────────

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# ─────────────────────────────────────────────────────────────────────────────
# AWS S3 - dev bucket
# Either use a real dev S3 bucket or LocalStack:
# docker run -p 4566:4566 localstack/localstack
# ─────────────────────────────────────────────────────────────────────────────

aws.region=ap-south-1
aws.s3.bucket-name=passnikaal-dev

# ─────────────────────────────────────────────────────────────────────────────
# BUSINESS RULES - shorter cutoff for dev testing convenience
# ─────────────────────────────────────────────────────────────────────────────

outpass.market.creation-cutoff-time=23:59

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING - verbose in dev
# ─────────────────────────────────────────────────────────────────────────────

logging.level.com.passnikaal=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.root=INFO
