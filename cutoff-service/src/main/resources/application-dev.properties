# =============================================================================
# PassNikaal - Cutoff Service
# DEV profile overrides (application-dev.properties)
# =============================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/passnikaal
spring.datasource.username=postgres
spring.datasource.password=aditi20052003

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

aws.region=ap-south-1
aws.s3.bucket-name=passnikaal-dev

# Dev cron: run 2 minutes after the app starts (for quick manual testing)
# Change to "0 0 21 * * *" for the real 9 PM schedule.
cutoff.cron=0 0 21 * * *

logging.level.com.passnikaal=DEBUG
logging.level.root=INFO
